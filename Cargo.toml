[workspace]
resolver = "2"
members = ["crates/core", "crates/collector", "crates/pricing", "crates/local-api", "crates/secrets", "crates/cli", "apps/mac"]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = "0.3"
ts-rs = "12"
rusqlite = { version = "0.40", features = ["bundled"] }
sha2 = "0.11"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
ryu-js = "1"
tempfile = "3"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
axum = "0.8"
tower = "0.5"
tower-http = "0.7"
hyper = "1"
hyper-util = "0.1"
clap = { version = "4", features = ["derive"] }
base64 = "0.23"
getrandom = "0.4"
subtle = "2"
tokio-util = "0.7"
url = "2"
gethostname = "1"
libc = "0.2"
ruzstd = "0.9"
# Local days in IANA time zones (F3). The system zoneinfo (`/usr/share/zoneinfo`), not a database bundled into the
# binary; no fat lookup tables or forced inlining, for the app's size and memory budgets.
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# The Mac app's size settings (R0: a 4.8 MB app). Cargo reads profiles only from the workspace root, so they apply to
# every release build here, the CLI's included.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
