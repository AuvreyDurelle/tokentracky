name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Preserve the full manual gate, including native validation, on any branch.
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verified:
    if: github.event_name == 'push'
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      checks: read
    outputs:
      ok: ${{ steps.check.outputs.ok }}
      deps: ${{ steps.deps.outputs.changed }}
    steps:
      # A pull request's caches serve only that pull request, and a verified tree skips
      # CI here, so nothing would refill main's Rust and npm caches. A push that changes
      # what they are keyed on runs CI on main once to save them.
      - id: deps
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          changed=$(gh api "repos/$REPO/compare/$BEFORE...$SHA" --jq '
            [.files[].filename | select(test("^(Cargo\\.lock|rust-toolchain\\.toml|\\.cargo/.*|package-lock\\.json|\\.github/workflows/ci\\.yml)$"))]
            | length > 0') || changed=true
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          echo "ok=false" >> "$GITHUB_OUTPUT"
          # Missing metadata falls back to every quality area.
          tree=$(gh api "repos/$REPO/git/commits/$SHA" --jq .tree.sha) || exit 0
          heads=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '.[] | select(.merged_at != null and .base.ref == "main") | .head.sha') || exit 0
          for head in $heads; do
            head_tree=$(gh api "repos/$REPO/git/commits/$head" --jq .tree.sha) || continue
            [ "$head_tree" = "$tree" ] || continue
            passed=$(gh api "repos/$REPO/commits/$head/check-runs?check_name=ci-ok" --jq '
              [.check_runs[] | select(.app.id == 15368 and .name == "ci-ok")]
              | sort_by(.id) | last | .conclusion == "success"') || continue
            if [ "$passed" = "true" ]; then
              echo "ci-ok passed on PR head $head, same tree as $SHA"
              echo "ok=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "No passing ci-ok on this tree; running every CI area"

  changes:
    needs: verified
    if: ${{ !cancelled() && !failure() && (needs.verified.outputs.ok != 'true' || needs.verified.outputs.deps == 'true') }}
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      verify: ${{ github.event_name != 'pull_request' || steps.filter.outputs['verify'] == 'true' }}
      rust: ${{ github.event_name != 'pull_request' || steps.filter.outputs['rust'] == 'true' }}
      rust-windows: ${{ github.event_name != 'pull_request' || steps.filter.outputs['rust-windows'] == 'true' }}
      native-cli: ${{ github.event_name != 'pull_request' || steps.filter.outputs['native-cli'] == 'true' }}
      native-cli-targets: ${{ steps.cli.outputs.targets }}
      native-macos: ${{ github.event_name != 'pull_request' || steps.filter.outputs['native-macos'] == 'true' }}
      mac-installer: ${{ github.event_name != 'pull_request' || steps.filter.outputs['mac-installer'] == 'true' }}
      workflows: ${{ github.event_name != 'pull_request' || steps.filter.outputs['workflows'] == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: .github/filters.yml
      # native-cli-windows is a subset of native-cli, so Linux builds whenever Windows does.
      - id: cli
        env:
          WINDOWS: ${{ github.event_name != 'pull_request' || steps.filter.outputs['native-cli-windows'] == 'true' }}
        run: |
          targets='{"os":"ubuntu-24.04","target":"x86_64-unknown-linux-musl","binary":"tokentracky"}'
          if [ "$WINDOWS" = true ]; then
            targets="$targets,"'{"os":"windows-2022","target":"x86_64-pc-windows-msvc","binary":"tokentracky.exe"}'
          fi
          echo "targets=[$targets]" >> "$GITHUB_OUTPUT"

  verify:
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs['verify'] == 'true' }}
    permissions:
      contents: read
    env:
      CARGO_INCREMENTAL: '0'
      TEST_DATABASE_URL: postgres://tokentracky:test-only-password@127.0.0.1:5432/tokentracky_test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: tokentracky_test
          POSTGRES_USER: tokentracky
          POSTGRES_PASSWORD: test-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tokentracky -d tokentracky_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: '1.99.0'
      # Only main saves Rust caches, which every pull request restores. Pull request
      # caches would serve one pull request each and crowd out main's in the quota.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: node --test scripts/check-hosted.test.mjs
      - run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/test_restore_drill.py
      - run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/test_native_runtime.py
      - run: node --test scripts/macos-release*.test.mjs scripts/cli-release*.test.mjs packaging/test/*.test.mjs
      - run: npm run test:harness --prefix packaging
      - run: shellcheck scripts/prepare-macos-release.sh scripts/prepare-cli-release.sh scripts/check-native-package.sh
      - run: npm run build

  rust:
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs['rust'] == 'true' }}
    permissions:
      contents: read
    env:
      CARGO_INCREMENTAL: '0'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: '1.99.0'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      # Embedded CLI assets are checked in native-macos after the web build. Keep this job Rust-only.
      - run: cargo clippy --workspace --exclude tokentracky-cli --all-targets --all-features -- -D warnings
      - run: cargo clippy -p tokentracky-cli --all-targets -- -D warnings
      - run: cargo test --workspace
        env:
          # Keep the checkout's generated types untouched so the check below compares against the committed files.
          TOKENTRACKY_TS_OUT: ${{ runner.temp }}/generated-types
          TOKENTRACKY_CEILINGS_OUT: ${{ runner.temp }}/generated-ceilings
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
      - run: scripts/check-generated-types.sh

  rust-windows:
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs['rust-windows'] == 'true' }}
    permissions:
      contents: read
    env:
      CARGO_INCREMENTAL: '0'
    # The CLI's Windows build. The Mac app is macOS only.
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: '1.99.0'
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --exclude tokentracky-mac --all-targets -- -D warnings
      - run: cargo test --workspace --exclude tokentracky-mac --no-fail-fast
        env:
          TOKENTRACKY_TS_OUT: ${{ runner.temp }}/generated-types
          TOKENTRACKY_CEILINGS_OUT: ${{ runner.temp }}/generated-ceilings

  native-cli:
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs['native-cli'] == 'true' }}
    permissions:
      contents: read
    env:
      CARGO_INCREMENTAL: '0'
    # The distributed CLI with its dashboard, run as installed: static musl on Linux (one binary for every
    # distribution) and Windows. macOS runs the same check in native-macos. `changes` picks the targets.
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.native-cli-targets) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: '1.99.0'
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm ci
      - run: npm run build --workspace=@tokentracky/web
      - run: cargo build --locked --release -p tokentracky-cli --features embed-web --target ${{ matrix.target }}
      # The runner has Visual Studio; a clean Windows has no Visual C++ runtime for the CLI to import.
      - if: runner.os == 'Windows'
        run: |
          if grep -aiq 'vcruntime140\.dll' "target/${{ matrix.target }}/release/${{ matrix.binary }}"; then
            echo 'The Windows CLI needs the Visual C++ runtime' >&2; exit 1
          fi
      # Windows runners have `python`; `python3` there may be the Microsoft Store's placeholder.
      - run: >-
          ${{ runner.os == 'Windows' && 'python' || 'python3' }} scripts/check-standalone-cli.py
          --binary "target/${{ matrix.target }}/release/${{ matrix.binary }}" --web-dist apps/web/dist
        env:
          PYTHONDONTWRITEBYTECODE: '1'

  native-macos:
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs['native-macos'] == 'true' }}
    permissions:
      contents: read
    env:
      CARGO_INCREMENTAL: '0'
    # Builds the Tauri app, Rust CLI and React resources on Apple Silicon.
    # Validate native inputs on the PR so a verified main tree can reuse the result.
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: '1.99.0'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm ci
      - run: npm run build --workspace=@tokentracky/web
      - run: cargo clippy -p tokentracky-cli --all-targets --features embed-web -- -D warnings
      - run: cargo test -p tokentracky-cli --features embed-web
      - run: cargo clippy -p tokentracky-mac --all-targets -- -D warnings
      - run: cargo test -p tokentracky-mac
        env:
          TOKENTRACKY_TS_OUT: ${{ runner.temp }}/generated-types
          TOKENTRACKY_CEILINGS_OUT: ${{ runner.temp }}/generated-ceilings
      - name: Install the pinned prebuilt Tauri CLI
        run: |
          archive="$RUNNER_TEMP/cargo-tauri.zip"
          curl --fail --location --silent --show-error --retry 3 \
            https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v2.11.5/cargo-tauri-aarch64-apple-darwin.zip \
            --output "$archive"
          echo "7734f1d942dbe6e5fea91c1575452f4bf2cc942e6902f2d9d78513baa8527b24  $archive" | shasum -a 256 --check
          unzip -q "$archive" -d "$RUNNER_TEMP/tauri-cli"
          # macos-15 ships rustup outside ~/.cargo, so the directory cargo searches for subcommands may not exist.
          mkdir -p "$HOME/.cargo/bin"
          install -m 755 "$RUNNER_TEMP/tauri-cli/cargo-tauri" "$HOME/.cargo/bin/cargo-tauri"
          cargo tauri --version
      - run: bash scripts/check-native-package.sh

  mac-installer:
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs['mac-installer'] == 'true' }}
    runs-on: macos-15
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      # The only launcher test that requires macOS: attach/copy/detach a real DMG.
      - run: node --test --test-name-pattern='installs the verified Mac app' packaging/test/launcher.test.mjs

  workflows:
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.workflows == 'true' }}
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: pipx run zizmor==1.32.0 --min-severity medium .github/workflows
        env:
          GH_TOKEN: ${{ github.token }}

  ci-ok:
    if: always()
    needs: [verified, changes, verify, rust, rust-windows, native-cli, native-macos, mac-installer, workflows]
    runs-on: ubuntu-slim
    timeout-minutes: 2
    permissions: {}
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e '[.[].result] | any(. == "failure" or . == "cancelled") | not' || exit 1
          if [ "$(jq -r '.verified.outputs.ok' <<< "$RESULTS")" = "true" ]; then
            exit 0
          fi
          [ "$(jq -r '.changes.result' <<< "$RESULTS")" = "success" ] || exit 1
          for area in verify rust rust-windows native-cli native-macos mac-installer workflows; do
            selected=$(jq -r --arg area "$area" '.changes.outputs[$area]' <<< "$RESULTS")
            result=$(jq -r --arg area "$area" '.[$area].result' <<< "$RESULTS")
            if [ "$selected" = "true" ] && [ "$result" != "success" ]; then
              echo "::error::Selected area $area did not pass ($result)"
              exit 1
            fi
          done
