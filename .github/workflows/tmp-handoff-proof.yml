# TEMPORARY: proof of the CLI's app hand-over and Run-value guard on Windows. Removed before merge.
name: tmp handoff proof
on:
  push:
    branches: [desktop-handoff-installers]
permissions: {}
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: '1.99.0'
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: false
      - run: cargo clippy -p tokentracky-cli --all-targets -- -D warnings
      - run: cargo test -p tokentracky-cli --no-fail-fast
      - run: cargo build -p tokentracky-cli
      - name: Stand-in app that records its launch
        shell: pwsh
        run: |
          'fn main() { let a: Vec<String> = std::env::args().collect(); std::fs::write(std::env::temp_dir().join("tokentracky-launched.txt"), a.join(" ")).unwrap(); }' | Set-Content "$env:RUNNER_TEMP\standin.rs"
          rustc -O "$env:RUNNER_TEMP\standin.rs" -o "$env:RUNNER_TEMP\standin.exe"
      - name: open starts the per-user install
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cli = "$env:GITHUB_WORKSPACE\target\debug\tokentracky.exe"
          $data = "$env:RUNNER_TEMP\data"
          $marker = "$env:TEMP\tokentracky-launched.txt"
          Write-Host '== no app installed'
          & $cli open --data-dir $data; Write-Host "exit=$LASTEXITCODE"
          if ($LASTEXITCODE -ne 1) { throw 'expected exit 1 without the app' }
          New-Item -ItemType Directory -Force "$env:LOCALAPPDATA\Tokentracky" | Out-Null
          Copy-Item "$env:RUNNER_TEMP\standin.exe" "$env:LOCALAPPDATA\Tokentracky\tokentracky-mac.exe"
          Write-Host '== app installed per user'
          $out = & $cli open --data-dir $data; Write-Host "$out exit=$LASTEXITCODE"
          if ($out -ne 'Tokentracky is open in the tray.') { throw "unexpected: $out" }
          for ($i = 0; $i -lt 50 -and -not (Test-Path $marker); $i++) { Start-Sleep -Milliseconds 100 }
          Write-Host "launched: $(Get-Content $marker)"
          if (-not ((Get-Content $marker) -like "*\Tokentracky\tokentracky-mac.exe*")) { throw 'the app did not start' }
      - name: uninstall leaves the app's Run value and removes the CLI's
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cli = "$env:GITHUB_WORKSPACE\target\debug\tokentracky.exe"
          $run = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          $data = "$env:RUNNER_TEMP\data"
          $app = "`"$env:LOCALAPPDATA\Tokentracky\tokentracky-mac.exe`" --hidden"
          Set-ItemProperty -Path $run -Name Tokentracky -Value $app
          New-Item -ItemType Directory -Force "$env:LOCALAPPDATA\tokentracky\bin" | Out-Null
          Copy-Item "$env:RUNNER_TEMP\standin.exe" "$env:LOCALAPPDATA\tokentracky\bin\tokentracky.exe"
          Write-Host '== the Run value is the app''s launch at login'
          & $cli uninstall --yes --data-dir $data; Write-Host "exit=$LASTEXITCODE"
          $left = (Get-ItemProperty -Path $run -Name Tokentracky).Tokentracky
          Write-Host "Run value after uninstall: $left"
          if ($left -ne $app) { throw 'uninstall changed the app''s Run value' }
          if (Test-Path "$env:LOCALAPPDATA\tokentracky\bin") { throw 'the CLI copy is still there' }
          if (-not (Test-Path "$env:LOCALAPPDATA\Tokentracky\tokentracky-mac.exe")) { throw 'uninstall touched the app' }
          Write-Host '== the Run value is the CLI''s job (a non-ASCII data folder, which reg prints garbled)'
          New-Item -ItemType Directory -Force "$env:LOCALAPPDATA\tokentracky\bin" | Out-Null
          Copy-Item "$env:RUNNER_TEMP\standin.exe" "$env:LOCALAPPDATA\tokentracky\bin\tokentracky.exe"
          $job = "`"C:\Windows\System32\conhost.exe`" --headless `"$env:LOCALAPPDATA\tokentracky\bin\tokentracky.exe`" serve --background --data-dir `"$env:USERPROFILE\Zo$([char]0xEB) data`""
          Set-ItemProperty -Path $run -Name Tokentracky -Value $job
          reg query 'HKCU\Software\Microsoft\Windows\CurrentVersion\Run' /v Tokentracky
          & $cli uninstall --yes --data-dir $data; Write-Host "exit=$LASTEXITCODE"
          $gone = $null -eq (Get-ItemProperty -Path $run -Name Tokentracky -ErrorAction SilentlyContinue)
          Write-Host "CLI Run value removed: $gone"
          if (-not $gone) { throw 'uninstall left the CLI''s Run value' }
          if (Test-Path "$env:LOCALAPPDATA\tokentracky\bin") { throw 'the CLI copy is still there' }
