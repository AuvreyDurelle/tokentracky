# TEMPORARY: proof that the desktop app runs on Windows and Linux. Removed before merge.
name: Windows proof

on:
  push:
    branches: [desktop-windows-linux-app]

permissions: {}

jobs:
  proof:
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: '1.99.0'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: false
      - run: npm ci
      - run: npm run build --workspace=@tokentracky/web
      - run: cargo build -p tokentracky-mac
      - name: Run the app and capture it
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing, UIAutomationClient, UIAutomationTypes
          Add-Type @'
          using System; using System.Runtime.InteropServices;
          public static class Mouse {
            [DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y);
            [DllImport("user32.dll")] public static extern void mouse_event(uint f, uint x, uint y, uint d, UIntPtr e);
            public static void Click(int x, int y) {
              SetCursorPos(x, y); mouse_event(2, 0, 0, 0, UIntPtr.Zero);
              System.Threading.Thread.Sleep(80); mouse_event(4, 0, 0, 0, UIntPtr.Zero);
            }
          }
          '@
          $out = Join-Path $env:RUNNER_TEMP 'proof'
          New-Item -ItemType Directory -Force $out | Out-Null
          $env:TOKENTRACKY_HOME = (New-Item -ItemType Directory -Force (Join-Path $env:RUNNER_TEMP 'tt-home')).FullName
          $env:TOKENTRACKY_PRICING_REFRESH = '0'
          $exe = (Resolve-Path 'target\debug\tokentracky-mac.exe').Path
          $script:log = Join-Path $out 'app.log'
          function LogText($path = $script:log) {
            try {
              $fs = [System.IO.File]::Open($path, 'Open', 'Read', 'ReadWrite')
              $sr = New-Object System.IO.StreamReader $fs; $t = $sr.ReadToEnd(); $sr.Close(); $t
            } catch { '' }
          }
          function Count($pattern, $path = $script:log) { ([regex]::Matches((LogText $path), [regex]::Escape($pattern))).Count }
          function WaitCount($pattern, $n, $seconds, $path = $script:log) {
            for ($i = 0; $i -lt $seconds * 4; $i++) { if ((Count $pattern $path) -ge $n) { return $true }; Start-Sleep -Milliseconds 250 }
            Write-Output "timeout waiting for $n x '$pattern'"; return $false
          }
          function Shot($name) {
            $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size)
            $bmp.Save((Join-Path $out "$name.png")); $g.Dispose(); $bmp.Dispose()
            Write-Output "screenshot $name"
          }
          function Second($arg, $name) {
            $p = Start-Process -FilePath $exe -ArgumentList $arg -NoNewWindow -PassThru -RedirectStandardError (Join-Path $out "$name.log")
            if (-not $p.WaitForExit(20000)) { Write-Output "SECOND INSTANCE HUNG: $arg (the running app does not answer)"; $p.Kill(); return $false }
            return $true
          }
          function TrayIcon() {
            $root = [System.Windows.Automation.AutomationElement]::RootElement
            $any = [System.Windows.Automation.Condition]::TrueCondition
            $cond = New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::ClassNameProperty, 'Shell_TrayWnd')
            $bar = $root.FindFirst([System.Windows.Automation.TreeScope]::Children, $cond)
            $areaCond = New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::NameProperty, 'User Promoted Notification Area')
            $area = $bar.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $areaCond)
            foreach ($e in $area.FindAll([System.Windows.Automation.TreeScope]::Children, $any)) {
              $c = $e.Current
              Write-Output "  notification area > '$($c.Name)' $($c.BoundingRectangle)"
              if ($c.Name -like 'Tokentracky*') { $r = $c.BoundingRectangle; $script:icon = @([int]($r.X + $r.Width / 2), [int]($r.Y + $r.Height / 2)) }
            }
          }
          function Windows($id) {
            $root = [System.Windows.Automation.AutomationElement]::RootElement
            foreach ($w in $root.FindAll([System.Windows.Automation.TreeScope]::Children, [System.Windows.Automation.Condition]::TrueCondition)) {
              $c = $w.Current; if ($c.ProcessId -eq $id) { $w }
            }
          }

          # Every tray icon in the taskbar, none in the overflow, so a click can reach it.
          Set-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer' -Name EnableAutoTray -Value 0
          Stop-Process -Name explorer -Force; Start-Sleep 6
          if (-not (Get-Process explorer -ErrorAction SilentlyContinue)) { Start-Process explorer; Start-Sleep 6 }

          $env:TOKENTRACKY_HOME = (New-Item -ItemType Directory -Force (Join-Path $env:RUNNER_TEMP 'tt-home')).FullName
          $app = Start-Process -FilePath $exe -ArgumentList '--hidden' -NoNewWindow -PassThru -RedirectStandardError $script:log
          WaitCount 'title-set' 1 120 | Out-Null
          Start-Sleep 3

          # 1. The popover at the icon: above it, since the taskbar is at the bottom.
          Second '--open-popover' 'second-popover' | Out-Null
          WaitCount 'popover visible' 1 30 | Out-Null
          Start-Sleep 2
          Shot '1-popover-above-icon'

          # 2. The dashboard opens while the popover is open, which closes.
          if (Second '--open-dashboard' 'second-dashboard') { Write-Output 'second launch answered' }
          WaitCount 'page-load finished path=/' 1 60 | Out-Null
          Start-Sleep 3
          Write-Output "after the dashboard: popovers shown=$(Count 'popover visible') windows destroyed=$(Count 'window destroyed')"
          Shot '2-dashboard'
          # A minimized dashboard comes back.
          $dash = Windows $app.Id | Where-Object { $_.Current.Name -eq 'Tokentracky' } | Select-Object -First 1
          $wp = $dash.GetCurrentPattern([System.Windows.Automation.WindowPattern]::Pattern)
          $wp.SetWindowVisualState([System.Windows.Automation.WindowVisualState]::Minimized); Start-Sleep 2
          Write-Output "dashboard minimized: $($wp.Current.WindowVisualState)"
          Second '--open-dashboard' 'second-dashboard-2' | Out-Null
          Start-Sleep 3
          Write-Output "dashboard after --open-dashboard: $($wp.Current.WindowVisualState)"
          Shot '2b-dashboard-restored'

          # 3. Two clicks on the tray icon: the first opens the popover, the second closes it.
          $script:icon = $null
          TrayIcon
          if ($script:icon) {
            $x, $y = $script:icon
            Write-Output "tray icon at $x,$y"
            [Mouse]::Click($x, $y)
            WaitCount 'popover visible' 2 30 | Out-Null
            Start-Sleep 2
            Shot '3-popover-click'
            $shown = Count 'popover visible'; $gone = Count 'window destroyed'
            [Mouse]::Click($x, $y)
            Start-Sleep 4
            Write-Output "second click: popovers shown $shown -> $(Count 'popover visible'), windows destroyed $gone -> $(Count 'window destroyed')"
            Shot '4-second-click'

            # 4. With the dashboard closed, the popover's own Open dashboard button.
            Second '--close-dashboard' 'second-close' | Out-Null
            Start-Sleep 3
            $before = Count 'popover visible'
            [Mouse]::Click($x, $y)
            WaitCount 'popover visible' ($before + 1) 30 | Out-Null
            Start-Sleep 2
            $pop = Windows $app.Id | Where-Object { $_.Current.ClassName -eq 'Tauri Window' } | Select-Object -First 1
            if ($pop) {
              $r = $pop.Current.BoundingRectangle
              Write-Output "popover window $r"
              $loads = Count 'page-load finished path=/'
              [Mouse]::Click([int]($r.X + $r.Width / 6), [int]($r.Y + $r.Height - 28))
              WaitCount 'page-load finished path=/' ($loads + 1) 60 | Out-Null
              Start-Sleep 3
              Write-Output "after Open dashboard: page loads $loads -> $(Count 'page-load finished path=/'), popovers open=$(@(Windows $app.Id | Where-Object { $_.Current.Name -ne 'Tokentracky' -and $_.Current.ClassName -eq 'Tauri Window' }).Count)"
              Shot '5-open-dashboard-button'
            } else { Write-Output 'popover window not found' }
          } else { Write-Output 'tray icon not found' }

          # 5. A startup alert does not hold the app up: an invalid leaderboard origin, and the dashboard still loads.
          Second '--quit' 'second-quit' | Out-Null
          $app.WaitForExit(30000) | Out-Null
          Write-Output "first instance exited: $($app.HasExited)"
          $env:TOKENTRACKY_CLOUD_URL = 'http://example.invalid'
          $script:log = Join-Path $out 'app-alert.log'
          $app2 = Start-Process -FilePath $exe -ArgumentList '--open-dashboard' -NoNewWindow -PassThru -RedirectStandardError $script:log
          WaitCount 'page-load finished path=/' 1 120 | Out-Null
          Start-Sleep 4
          Shot '6-dashboard-with-alert-behind'
          $dialog = Windows $app2.Id | Where-Object { $_.Current.ClassName -eq '#32770' } | Select-Object -First 1
          if ($dialog) { Write-Output "alert window '$($dialog.Current.Name)'"; try { $dialog.SetFocus() } catch { Write-Output "focus: $_" }; Start-Sleep 2 } else { Write-Output 'alert window not found' }
          Shot '7-alert'
          # The alert blocks nothing: the dashboard still answers a click while it is open.
          $dash2 = Windows $app2.Id | Where-Object { $_.Current.Name -eq 'Tokentracky' } | Select-Object -First 1
          # The sidebar's Tokens link, 69,157 from the window's top left at this size.
          $r = $dash2.Current.BoundingRectangle
          Write-Output "dashboard window $r"
          [Mouse]::Click([int]($r.X + 69), [int]($r.Y + 157))
          Start-Sleep 3
          Write-Output "alert still open after the click: $(@(Windows $app2.Id | Where-Object { $_.Current.ClassName -eq '#32770' }).Count)"
          Shot '8-dashboard-clicked-with-alert-open'
          Stop-Process -Id $app2.Id -Force -ErrorAction SilentlyContinue

          # The value launch at login wrote.
          foreach ($hive in 'HKCU', 'HKLM') {
            Write-Output "$hive Run:"; Get-ItemProperty "$($hive):\Software\Microsoft\Windows\CurrentVersion\Run" | Format-List | Out-String | Write-Output
          }
          foreach ($f in Get-ChildItem $out -Filter *.log) { Write-Output "==== $($f.Name)"; LogText $f.FullName }
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-proof
          path: ${{ runner.temp }}/proof

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: '1.99.0'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: false
      - run: >-
          sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
          xvfb openbox stalonetray xdotool imagemagick x11-utils dbus-x11 fonts-noto-core
      - run: npm ci
      - run: npm run build --workspace=@tokentracky/web
      - run: cargo build -p tokentracky-mac
      - name: Run the app and capture it
        run: |
          cat > "$RUNNER_TEMP/proof.sh" <<'SCRIPT'
          OUT="$RUNNER_TEMP/proof"; mkdir -p "$OUT"
          export DISPLAY=:99 NO_AT_BRIDGE=1
          Xvfb :99 -screen 0 1440x900x24 >/dev/null 2>&1 &
          sleep 2
          openbox >/dev/null 2>&1 &
          stalonetray --geometry 1x1-0+0 --icon-size 22 --grow-gravity NE --icon-gravity NE --background '#202020' >/dev/null 2>&1 &
          sleep 2
          export TOKENTRACKY_HOME="$(mktemp -d)" TOKENTRACKY_PRICING_REFRESH=0
          APP="$PWD/target/debug/tokentracky-mac"
          LOG="$OUT/app.log"
          count() { grep -c "$1" "${2:-$LOG}" 2>/dev/null || true; }
          wait_n() { i=0; while [ "$(count "$1" "${3:-$LOG}")" -lt "$2" ]; do i=$((i+1)); [ $i -gt 600 ] && { echo "timeout waiting for $2 x $1"; return 1; }; sleep 0.2; done; }
          shot() { import -window root "$OUT/$1.png"; echo "screenshot $1"; }
          "$APP" --open-dashboard >"$LOG" 2>&1 &
          wait_n 'page-load finished path=/$' 1; sleep 3; shot 1-dashboard
          timeout 20 "$APP" --open-popover || echo 'second launch hung'
          wait_n 'popover visible' 1; sleep 2; shot 2-popover-flag
          xdotool mousemove 400 600 click 1; sleep 2; echo "after a click elsewhere: destroyed=$(count 'window destroyed')"
          TRAY=$(xdotool search --class stalonetray | head -1); eval "$(xdotool getwindowgeometry --shell "$TRAY")"
          TX=$((X + WIDTH - 12)); TY=$((Y + 12))
          xdotool mousemove $TX $TY click 1; sleep 1.5; shot 3-tray-menu
          xdotool key Down; sleep 0.3; xdotool key Return
          wait_n 'popover visible' 2; sleep 2
          echo "focus after Open summary: $(xdotool getwindowfocus getwindowname)"; shot 4-popover-from-menu
          xdotool mousemove 400 600 click 1; sleep 2; echo "after a click elsewhere: destroyed=$(count 'window destroyed')"
          # About from the menu; the dashboard still answers a click while it is open.
          xdotool mousemove $TX $TY click 1; sleep 1.5; xdotool key Up Up; sleep 0.3; xdotool key Return; sleep 2; shot 5-about
          xdotool mousemove 67 161 click 1; sleep 2
          echo "About windows still open after the click: $(xdotool search --name 'About Tokentracky' | wc -l)"; shot 6-dashboard-clicked-with-about-open
          # A minimized dashboard comes back.
          DASH=$(xdotool search --name '^Tokentracky$' | head -1)
          xdotool windowminimize "$DASH"; sleep 2; echo "minimized: $(xprop -id "$DASH" _NET_WM_STATE)"
          timeout 20 "$APP" --open-dashboard; sleep 3
          echo "after --open-dashboard: $(xprop -id "$DASH" _NET_WM_STATE)"; shot 7-dashboard-restored
          timeout 20 "$APP" --quit; sleep 3
          TOKENTRACKY_CLOUD_URL=http://example.invalid "$APP" --open-dashboard >"$OUT/app-alert.log" 2>&1 &
          wait_n 'page-load finished path=/$' 1 "$OUT/app-alert.log"; sleep 3; shot 8-alert
          xdotool mousemove 67 161 click 1; sleep 2
          echo "alert windows still open after the click: $(xdotool search --name 'Leaderboard configuration is invalid' | wc -l)"; shot 9-dashboard-clicked-with-alert-open
          pkill tokentracky-mac || true
          echo '==== app.log'; cat "$LOG"; echo '==== app-alert.log'; cat "$OUT/app-alert.log"
          SCRIPT
          dbus-run-session -- bash "$RUNNER_TEMP/proof.sh"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-proof
          path: ${{ runner.temp }}/proof
