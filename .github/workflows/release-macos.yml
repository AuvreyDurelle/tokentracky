# The file keeps its name: npm trusted publishing is pinned to it (docs/MAC_RELEASE.md).
name: Release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Version tag to package (for example v0.1.0)'
        required: true
        type: string
      signing:
        description: 'adhoc (no Apple account; users click Open Anyway once) or developer-id (notarized)'
        required: true
        type: choice
        options: [adhoc, developer-id]
      publish:
        description: 'Publish after the checks (false keeps the complete release as a draft)'
        required: false
        type: boolean
        default: true

# Builds the macOS candidate and the Linux and Windows CLIs on their own runners, then puts them
# into one GitHub draft and checks every asset arrived intact. Unless publish is false, it then
# marks the release live and latest. Drafts are never "latest", so the website download
# (releases/latest/download/Tokentracky.dmg) and the updater feed keep the previous release
# until this one is complete.
permissions:
  contents: write
  actions: read

jobs:
  build-macos:
    runs-on: macos-14
    environment: macos-release
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: '1.99.0'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@bc2d2e71bd35c5549942babaa51a89c586b981d1 # v2.8.1
      - run: npm ci
      - run: node --test scripts/macos-release*.test.mjs scripts/cli-release*.test.mjs packaging/test/*.test.mjs
      - run: npm run test:harness --prefix packaging
      - run: brew install minisign
      - run: npm run build --workspace=@tokentracky/web
      - run: cargo fmt --all --check
      - run: cargo clippy -p tokentracky-mac --all-targets -- -D warnings
      - run: cargo test -p tokentracky-mac
        env:
          TOKENTRACKY_TS_OUT: ${{ runner.temp }}/generated-types
      # Pinning the CLI gives deterministic updater artifact/signature behavior for this pipeline.
      - run: cargo install tauri-cli --version 2.11.5 --locked
      - name: Build, sign, notarize (Developer ID only), staple and inventory the candidate
        env:
          GH_TOKEN: ${{ github.token }}
          TOKENTRACKY_SIGNING: ${{ inputs.signing }}
          # Apple material reaches the script only for a Developer ID build.
          APPLE_CERTIFICATE_BASE64: ${{ inputs.signing == 'developer-id' && secrets.APPLE_CERTIFICATE_BASE64 || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ inputs.signing == 'developer-id' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ inputs.signing == 'developer-id' && vars.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_API_KEY_ID: ${{ inputs.signing == 'developer-id' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ inputs.signing == 'developer-id' && secrets.APPLE_API_ISSUER || '' }}
          APPLE_API_PRIVATE_KEY_BASE64: ${{ inputs.signing == 'developer-id' && secrets.APPLE_API_PRIVATE_KEY_BASE64 || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TOKENTRACKY_UPDATER_PUBLIC_KEY: ${{ vars.TOKENTRACKY_UPDATER_PUBLIC_KEY }}
          TOKENTRACKY_UPDATER_ENDPOINT: ${{ vars.TOKENTRACKY_UPDATER_ENDPOINT }}
          TOKENTRACKY_UPDATER_CHANNEL: ${{ vars.TOKENTRACKY_UPDATER_CHANNEL }}
          # Every release's assets live under its own tag; the feed points the updater there.
          TOKENTRACKY_RELEASE_BASE_URL: https://github.com/AuvreyDurelle/tokentracky/releases/download/${{ inputs.ref }}
          GITHUB_REF_NAME: ${{ inputs.ref }}
        run: bash scripts/prepare-macos-release.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-release-candidate
          path: dist/macos-release
          if-no-files-found: error

  # The CLI alone, unsigned, for each system it runs on. No secrets, so no environment approval.
  build-cli:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            os: windows-2022
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: '1.99.0'
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@bc2d2e71bd35c5549942babaa51a89c586b981d1 # v2.8.1
      - run: npm ci
      - name: Build and check the candidate
        env:
          GITHUB_REF_NAME: ${{ inputs.ref }}
          # Windows runners have `python`; `python3` there may be the Microsoft Store's placeholder.
          PYTHON: ${{ runner.os == 'Windows' && 'python' || 'python3' }}
        run: bash scripts/prepare-cli-release.sh "${{ matrix.target }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-release-${{ matrix.target }}
          path: dist/cli-release/${{ matrix.target }}
          if-no-files-found: error

  publish:
    needs: [build-macos, build-cli]
    runs-on: ubuntu-latest
    environment: macos-release
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos-release-candidate
          path: dist/macos-release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: cli-release-*
          path: dist/cli-release
      - name: Create the draft with every public asset
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING: ${{ inputs.signing }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          # One manifest for every platform, published under the name the macOS candidate gave it.
          node scripts/macos-release.mjs merge --out "$RUNNER_TEMP/verified-candidate-manifest.json" \
            dist/macos-release/verified-candidate-manifest.json dist/cli-release/*/manifest-fragment.json
          # The candidate folders stay as evidence; the release gets the macOS top-level files, a
          # fixed-name DMG for the website's latest link, each CLI, the merged manifest and checksums
          # of exactly what is uploaded.
          mkdir dist/public
          find dist/macos-release -maxdepth 1 -type f ! -name SHA256SUMS ! -name verified-candidate-manifest.json \
            -exec cp {} dist/public/ \;
          cp "dist/public/tokentracky-${version}-macos-arm64.dmg" dist/public/Tokentracky.dmg
          cp dist/cli-release/*/"tokentracky-${version}-"* dist/public/
          for cli in linux-x86_64 linux-aarch64 windows-x86_64.exe; do
            [[ -f "dist/public/tokentracky-${version}-${cli}" ]] || { echo "missing the ${cli} CLI" >&2; exit 1; }
          done
          cp "$RUNNER_TEMP/verified-candidate-manifest.json" dist/public/
          cd dist/public
          shasum -a 256 -- * | LC_ALL=C sort -k2 >"$RUNNER_TEMP/SHA256SUMS"
          mv "$RUNNER_TEMP/SHA256SUMS" SHA256SUMS
          # The backticks are Markdown.
          # shellcheck disable=SC2016
          {
            if [[ "$SIGNING" == adhoc ]]; then
              printf '**First launch on a Mac:** macOS says it cannot check the app. Open System Settings → Privacy & Security and click **Open Anyway**. On macOS 13–14 you can instead right-click the app and choose Open. You only do this once.\n\n'
            fi
            printf '**Linux:** download `tokentracky-%s-linux-x86_64` (or `-linux-aarch64` on Arm), run `chmod +x` on it, then run it with `serve`. One static binary runs on every distribution.\n\n' "$version"
            printf '**Windows:** download `tokentracky-%s-windows-x86_64.exe` and run it with `serve` from a terminal. The CLI is not signed yet, so Windows may say it does not recognise the file: choose More info → Run anyway.\n\n' "$version"
            printf 'Or, with Node.js 18 or later on any of them: `npx tokentracky login`.\n\n'
            cat release-notes.md
            printf '\n### SHA-256 checksums\n\n```\n'
            cat SHA256SUMS
            printf '```\n'
          } >"$RUNNER_TEMP/notes.md"
          gh release create "v${version}" ./* --draft --verify-tag --title "Tokentracky v${version}" \
            --notes-file "$RUNNER_TEMP/notes.md"
      - name: Check the draft holds exactly these bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          [[ "$(gh release view "v${version}" --json isDraft --jq .isDraft)" == true ]]
          diff <(find dist/public -maxdepth 1 -type f -exec basename {} \; | LC_ALL=C sort) \
            <(gh release view "v${version}" --json assets --jq '.assets[].name' | LC_ALL=C sort)
          gh release download "v${version}" --dir "$RUNNER_TEMP/downloaded"
          (cd "$RUNNER_TEMP/downloaded" && shasum -a 256 -c SHA256SUMS)
      - name: Publish the release as latest
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          gh release edit "v${version}" --draft=false --latest

  homebrew:
    needs: publish
    if: ${{ inputs.publish }}
    runs-on: macos-14
    environment: macos-release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos-release-candidate
          path: dist/macos-release
      - name: Update the Homebrew tap
        if: ${{ inputs.publish }}
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$TAP_TOKEN" ]]; then
            echo '::warning::HOMEBREW_TAP_TOKEN is not set, so the Homebrew tap was not updated.'
            exit 0
          fi
          version=$(node -p "require('./package.json').version")
          tap="$RUNNER_TEMP/homebrew-tokentracky"
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/AuvreyDurelle/homebrew-tokentracky.git" "$tap"
          mkdir -p "$tap/Casks" "$tap/Formula"
          cp dist/macos-release/homebrew/Casks/tokentracky.rb "$tap/Casks/"
          cp dist/macos-release/homebrew/Formula/tokentracky-cli.rb "$tap/Formula/"
          git -C "$tap" add Casks Formula
          if git -C "$tap" diff --cached --quiet; then
            echo "The tap already describes ${version}."
            exit 0
          fi
          git -C "$tap" -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -qm "tokentracky ${version}"
          # Audit and install from the local commit before anyone can see it.
          brew tap auvreydurelle/tokentracky "$tap"
          brew audit --cask auvreydurelle/tokentracky/tokentracky
          brew audit --formula auvreydurelle/tokentracky/tokentracky-cli
          brew install --cask auvreydurelle/tokentracky/tokentracky
          brew install --formula auvreydurelle/tokentracky/tokentracky-cli
          brew test auvreydurelle/tokentracky/tokentracky-cli
          git -C "$tap" push origin HEAD

  # npm trusts this job's GitHub identity token instead of a stored token (trusted publishing). It is a
  # separate job so the build's third-party code (npm ci, cargo) never runs with id-token: write.
  publish-npm:
    needs: publish
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    environment: macos-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          ref: ${{ inputs.ref }}
      # Trusted publishing needs npm 11.5.1 or later; Node 24 bundles it.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Publish the npm launcher
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          # The package carries this release's manifest. prepublishOnly downloads both public files
          # again and refuses to publish unless their checksums match it.
          gh release download "v${version}" --pattern verified-candidate-manifest.json \
            --output packaging/release-manifest.json --clobber
          cd packaging
          npm publish
