# Dashboard source embeds the same way on every platform, and the Linux CLI build
# checks it. The Windows CLI and Mac builds wait for native or dependency changes:
# a lockfile can still break npm on one platform.
native-cli-windows:
  - 'Cargo.toml'
  - 'Cargo.lock'
  - '.cargo/**'
  - 'rust-toolchain.toml'
  - 'rustfmt.toml'
  - 'package.json'
  - 'package-lock.json'
  - '.npmrc'
  - 'apps/web/package.json'
  - 'apps/server/package.json'
  - 'packages/core/package.json'
