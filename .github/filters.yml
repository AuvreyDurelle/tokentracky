# Positive input globs. Root README is a Rust test fixture; docs/ and mockups are not inputs.
verify:
  - 'api/**'
  - 'apps/server/**/*.{ts,mjs,js,json}'
  - 'apps/web/**'
  - 'packages/**/*.{ts,js,mjs,json,sql}'
  - 'tests/**/*.ts'
  - 'fixtures/**/*.ts'
  - 'scripts/**'
  - 'packaging/**'
  - 'tsconfig.json'
  - 'vitest.config.ts'
  - 'eslint.config.js'
  - 'Dockerfile'
  - '.dockerignore'
  - 'vercel.json'
  - '.env.example'
  - '.gitignore'
  - 'package.json'
  - 'package-lock.json'
  - '.npmrc'
  - 'apps/web/package.json'
  - 'apps/server/package.json'
  - 'packages/core/package.json'
  - 'packages/cloud/package.json'
  - 'Cargo.toml'
  - 'Cargo.lock'
  - '.cargo/**'
  - 'rust-toolchain.toml'
  - 'rustfmt.toml'
  - 'crates/core/**'
  - 'crates/collector/**'
  - 'crates/pricing/**'
  - 'crates/local-api/**'
  - '.github/filters.yml'
  - '.github/workflows/**'
rust:
