[package]
name = "tokentracky-core"
description = "Shared types, validation and UTC day maths for Tokentracky"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "tokentracky_core"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
# `deserialize_with` keeps null apart from absent; ts-rs cannot parse it and would warn on every build.
ts-rs = { workspace = true, features = ["no-serde-warnings"] }

[dev-dependencies]
time = { workspace = true, features = ["macros"] }

[lints]
workspace = true
